<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HCMC Rain Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --border: #dbe4ee;
        --accent: #0369a1;
        --rain-no: #0ca30c;
        --rain-light: #fab219;
        --rain-medium: #ec835a;
        --rain-heavy: #d03b3b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        padding: 14px 20px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 19px; margin: 0; }
      header .sub { color: var(--muted); font-size: 13px; }
      /* keep attribution links subdued in the header -- discoverable on hover, not shouty */
      header .sub a { color: inherit; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
      header .sub a:hover { color: var(--accent); text-decoration-color: currentColor; }
      header a.back { margin-left: auto; font-size: 13px; color: var(--accent); text-decoration: none; }
      header a.back:hover { text-decoration: underline; }

      #map { position: absolute; top: 58px; bottom: 0; left: 0; right: 0; }

      .legend-box {
        position: relative;
        background: var(--card);
        padding: 10px 30px 10px 12px;
        border-radius: 8px;
        box-shadow: 0 2px 10px rgba(15,23,42,0.18);
        font-size: 12.5px;
        line-height: 1.9;
      }
      .legend-box .row { display: flex; align-items: center; gap: 8px; }
      .legend-box .sw { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.2); }
      .legend-box .title { font-weight: 600; margin-bottom: 4px; }
      .legend-box .note { color: var(--muted); font-size: 11px; margin-top: 4px; max-width: 180px; }
      .legend-box .muted-note { color: var(--muted); font-size: 10.5px; }
      .legend-box .toggle-row {
        display: flex; align-items: center; gap: 6px;
        margin-top: 8px; padding-top: 8px; border-top: 1px solid #eef2f7;
        font-size: 11.5px; color: var(--ink); cursor: pointer;
      }
      .legend-box .toggle-row input { cursor: pointer; }
      .legend-close {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      .legend-close:hover { background: #eef2f7; color: var(--ink); }
      .legend-reopen {
        display: none;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 2px 10px rgba(15,23,42,0.18);
        color: var(--muted);
        font-size: 16px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
      }
      .legend-reopen.show { display: flex; }
      .legend-reopen:hover { color: var(--ink); }

      .popup-card { font-size: 13px; min-width: 210px; }
      .popup-card .district { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
      .popup-card .loc { font-weight: 600; margin: 2px 0 6px; font-size: 13.5px; }
      .popup-card .badge {
        display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
        border-radius: 20px; color: #fff; margin-bottom: 6px;
      }
      .popup-card .just { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      .popup-card img { width: 100%; border-radius: 6px; display: block; cursor: zoom-in; }
      .popup-card .approx-note { font-size: 10.5px; color: var(--muted); font-style: italic; margin-top: 4px; }

      .popup-card .frame-slider { position: relative; }
      .popup-card .frame-nav {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 4px;
      }
      .popup-card .frame-nav.show { display: flex; }
      .popup-card .frame-nav button {
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 5px;
        width: 24px;
        height: 22px;
        line-height: 1;
        cursor: pointer;
        color: var(--ink);
        font-size: 13px;
        flex-shrink: 0;
      }
      .popup-card .frame-nav button:disabled { opacity: 0.35; cursor: default; }
      .popup-card .frame-nav button:not(:disabled):hover { background: #eef2f7; }
      .popup-card .frame-counter { font-size: 11px; color: var(--muted); }
      .popup-card .frame-caption { font-size: 10.5px; color: var(--muted); margin-top: 3px; }

      .lightbox {
        display: none;
        position: fixed; inset: 0; background: rgba(0,0,0,0.82);
        z-index: 5000; align-items: center; justify-content: center; padding: 24px;
      }
      .lightbox.show { display: flex; }
      .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
      .lightbox .caption { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <h1>HCMC Rain Map</h1>
      <span class="sub"><a href="https://giaothong.hochiminhcity.gov.vn/" target="_blank" rel="noopener">Live traffic-camera frames</a>
        &middot; rain intensity via <a href="https://deepmind.google/models/gemma/gemma-4/" target="_blank" rel="noopener">Gemma vision</a>
        &middot; real <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener">OpenStreetMap</a> tiles</span>
      <span class="sub" id="rainSummary" style="font-weight:600;"></span>
      <span class="sub" id="lastUpdated" style="font-style:italic;"></span>
      <a class="back" href="https://github.com/halean/rainmap" target="_blank" rel="noopener">Source &#8599;</a>
    </header>
    <div id="map"></div>
    <div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
      <img id="lightboxImg" src="" alt="camera frame" />
      <div class="caption" id="lightboxCaption"></div>
    </div>

    <script>
      // Colour is reserved for actual precipitation. "No rain" gets no colour of its own:
      // it is fully transparent on the radar field and a neutral marker on the map.
      const RAIN_COLORS = { No: "#94a3b8", Light: "#fab219", Medium: "#ec835a", Heavy: "#d03b3b" };

      const map = L.map("map", { scrollWheelZoom: true }).setView([10.78, 106.68], 11);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      // dedicated pane so camera pins always sit above the radar color field, regardless of add order
      map.createPane("pinsPane");
      map.getPane("pinsPane").style.zIndex = 650;

      // real-world precipitation radar (RainViewer), sits above basemap tiles but below our camera-based field
      map.createPane("realRadarPane");
      map.getPane("realRadarPane").style.zIndex = 350;
      map.getPane("realRadarPane").style.opacity = 0.75;

      let realRadarLayer = null;
      let realRadarLoaded = false;

      function ensureRealRadarLayer(cb) {
        if (realRadarLoaded) return cb();
        fetch("https://api.rainviewer.com/public/weather-maps.json")
          .then((r) => r.json())
          .then((data) => {
            const frames = data.radar.past;
            const latest = frames[frames.length - 1];
            const url = `${data.host}${latest.path}/256/{z}/{x}/{y}/2/1_1.png`;
            realRadarLayer = L.tileLayer(url, {
              pane: "realRadarPane",
              maxNativeZoom: 7,
              maxZoom: 19,
              tileSize: 256,
              attribution: "Radar &copy; <a href=\"https://www.rainviewer.com\">RainViewer</a>",
            });
            realRadarLoaded = true;
            cb();
          })
          .catch((e) => console.error("RainViewer load failed", e));
      }

      const LEGEND_HIDDEN_KEY = "hcmcRainMap.legendHidden";
      let legendBoxEl, reopenBtnEl;

      function setLegendVisible(visible) {
        if (legendBoxEl) legendBoxEl.style.display = visible ? "" : "none";
        if (reopenBtnEl) reopenBtnEl.classList.toggle("show", !visible);
        try { localStorage.setItem(LEGEND_HIDDEN_KEY, visible ? "0" : "1"); } catch (e) {}
      }

      const legend = L.control({ position: "topright" });
      legend.onAdd = function () {
        const wrap = L.DomUtil.create("div");
        L.DomEvent.disableClickPropagation(wrap);

        legendBoxEl = L.DomUtil.create("div", "legend-box", wrap);
        let rows = `<button class="legend-close" title="Hide legend">&times;</button><div class="title">Rain intensity</div>`;
        for (const [label, color] of Object.entries(RAIN_COLORS)) {
          // "No" is shown hollow: it has no colour on the radar, only a neutral pin
          const swatch = label === "No"
            ? `<span class="sw" style="background:transparent; border:1px dashed ${color};"></span>`
            : `<span class="sw" style="background:${color}"></span>`;
          const suffix = label === "No" ? ` <span class="muted-note">(not shown)</span>` : "";
          rows += `<div class="row">${swatch}${label}${suffix}</div>`;
        }
        rows += `<div class="note">Only rain is coloured &mdash; dry areas stay clear. The field is a radar-style interpolation between sampled cameras, not a per-point boundary. Click a pin for the live frame.</div>`;
        rows += `<label class="toggle-row"><input type="checkbox" id="realRadarToggle" /> Real weather radar (RainViewer)</label>`;
        legendBoxEl.innerHTML = rows;
        legendBoxEl.querySelector(".legend-close").addEventListener("click", () => setLegendVisible(false));
        legendBoxEl.querySelector("#realRadarToggle").addEventListener("change", (e) => {
          if (e.target.checked) {
            ensureRealRadarLayer(() => realRadarLayer.addTo(map));
          } else if (realRadarLayer) {
            map.removeLayer(realRadarLayer);
          }
        });

        reopenBtnEl = L.DomUtil.create("button", "legend-reopen", wrap);
        reopenBtnEl.title = "Show legend";
        reopenBtnEl.textContent = "ℹ";
        reopenBtnEl.addEventListener("click", () => setLegendVisible(true));

        let hidden = false;
        try { hidden = localStorage.getItem(LEGEND_HIDDEN_KEY) === "1"; } catch (e) {}
        setLegendVisible(!hidden);

        return wrap;
      };
      legend.addTo(map);

      // When the frame was taken -- not when Gemma read it, which can be 10+ min later.
      // Prefers the field the annotator writes; falls back to the fetcher's filename
      // stamp (UTC) so records written before that field existed still show a time.
      function capturedAt(p) {
        if (p.captured_at) return p.captured_at;
        const m = (p.image_url || "").match(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})\.\w+$/);
        return m ? `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z` : null;
      }

      function openLightbox(url, caption) {
        document.getElementById("lightboxImg").src = url;
        document.getElementById("lightboxCaption").textContent = caption;
        document.getElementById("lightbox").classList.add("show");
      }

      function openLightboxFor(camId) {
        const state = markerIndex[camId];
        if (!state) return;
        const p = state.point;
        const frame = (state.history && state.history[state.idx]) || { image_url: p.image_url, captured_at: capturedAt(p) };
        if (!frame.image_url) return;
        const when = frame.captured_at ? new Date(frame.captured_at).toLocaleString() : "";
        openLightbox(frame.image_url, `${p.location_text} — ${p.district}${when ? " · " + when : ""}`);
      }

      // History is fetched once per camera, on first popup open, and cached on the
      // marker's state (history/idx) so neither the frames nor the slide position
      // are lost when a poll rebuilds every marker.
      function renderFrame(camId) {
        const state = markerIndex[camId];
        if (!state || !state.history || !state.history.length) return;
        const el = state.marker.getPopup() && state.marker.getPopup().getElement();
        if (!el) return;
        const frame = state.history[state.idx];
        const img = el.querySelector(".frame-img");
        const counter = el.querySelector(".frame-counter");
        const caption = el.querySelector(".frame-caption");
        const nav = el.querySelector(".frame-nav");
        const prevBtn = el.querySelector(".frame-prev");
        const nextBtn = el.querySelector(".frame-next");
        const badge = el.querySelector(".badge");
        const just = el.querySelector(".just");
        if (img && frame.image_url) img.src = frame.image_url;
        // The verdict and the reasoning belong to the frame being viewed, not to the
        // live reading -- otherwise sliding back shows an old frame under a fresh call.
        if (badge && frame.rain) {
          badge.textContent = `${frame.rain} rain`;
          badge.style.background = RAIN_COLORS[frame.rain] || "#888";
        }
        if (just && frame.justification) just.textContent = frame.justification;
        // idx 0 is the newest frame, so count down from the total instead of up from 1 --
        // the newest frame reads as e.g. "12/12", oldest as "1/12".
        if (counter) counter.textContent = `${state.history.length - state.idx} / ${state.history.length}`;
        if (caption) caption.textContent = frame.captured_at ? new Date(frame.captured_at).toLocaleString() : "";
        if (nav) nav.classList.toggle("show", state.history.length > 1);
        if (prevBtn) prevBtn.disabled = state.idx >= state.history.length - 1;
        if (nextBtn) nextBtn.disabled = state.idx <= 0;
      }

      function slideFrame(camId, delta) {
        const state = markerIndex[camId];
        if (!state || !state.history) return;
        const newIdx = state.idx + delta;
        if (newIdx < 0 || newIdx >= state.history.length) return;
        state.idx = newIdx;
        renderFrame(camId);
      }

      function loadCameraHistory(camId) {
        const state = markerIndex[camId];
        if (!state) return;
        if (state.history) {
          renderFrame(camId);
          return;
        }
        fetch(`/api/rain-map/rain-history?camera_id=${encodeURIComponent(camId)}`)
          .then((r) => r.json())
          .then((history) => {
            const cur = markerIndex[camId];
            if (!cur || !history || !history.length) return;
            cur.history = history;
            cur.idx = 0;
            renderFrame(camId);
          })
          .catch((e) => console.error("camera history load failed", e));
      }

      const liveLayer = L.layerGroup().addTo(map);
      const openPopupCamId = () => {
        // remember which popup (if any) is open, keyed by camera_id, so a refresh doesn't yank it shut
        for (const [camId, layers] of Object.entries(markerIndex)) {
          if (layers.marker.isPopupOpen()) return camId;
        }
        return null;
      };
      const markerIndex = {};

      const RAIN_SCORE = { No: 0, Light: 1, Medium: 2, Heavy: 3 };

      // Precipitation-only ramp: Light -> Medium -> Heavy. There is deliberately no stop for
      // "No rain" -- dry ground is drawn as nothing at all, the way radar shows no echo.
      const PRECIP_STOPS = [[250, 178, 25], [236, 131, 90], [208, 59, 59]];

      const BAND_STEP = 0.4; // posterize into discrete radar-style bands instead of a smooth gradient

      function scoreToRGB(s) {
        s = Math.max(RAIN_SCORE.Light, Math.min(RAIN_SCORE.Heavy, s));
        s = Math.round(s / BAND_STEP) * BAND_STEP;
        s = Math.max(RAIN_SCORE.Light, Math.min(RAIN_SCORE.Heavy, s));
        const t = s - RAIN_SCORE.Light; // 0 at Light .. 2 at Heavy
        const i = Math.min(PRECIP_STOPS.length - 2, Math.floor(t));
        const f = t - i;
        const a = PRECIP_STOPS[i], b = PRECIP_STOPS[i + 1];
        return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
      }

      let radarOverlay = null;

      function renderRadar(points) {
        const withCoords = points.filter((p) => p.lat != null && p.lon != null);
        if (!withCoords.length) return;

        const PAD_DEG = 0.06; // ~6-7km padding so the field fades out past the outermost cameras
        const latMin = Math.min(...withCoords.map((p) => p.lat)) - PAD_DEG;
        const latMax = Math.max(...withCoords.map((p) => p.lat)) + PAD_DEG;
        const lonMin = Math.min(...withCoords.map((p) => p.lon)) - PAD_DEG;
        const lonMax = Math.max(...withCoords.map((p) => p.lon)) + PAD_DEG;
        const lat0 = (latMin + latMax) / 2;
        const kmPerDegLat = 110.57;
        const kmPerDegLon = 111.32 * Math.cos((lat0 * Math.PI) / 180);

        // radar-style: broad overlapping blobs (~4km influence radius) that merge into contiguous bands
        const SIGMA_KM = 4.0;
        const CUTOFF_KM = SIGMA_KM * 2.8;

        const GRID = 180;
        const off = document.createElement("canvas");
        off.width = GRID;
        off.height = GRID;
        const octx = off.getContext("2d");
        const img = octx.createImageData(GRID, GRID);

        for (let gy = 0; gy < GRID; gy++) {
          const lat = latMax - ((gy + 0.5) / GRID) * (latMax - latMin); // row 0 = north
          for (let gx = 0; gx < GRID; gx++) {
            const lon = lonMin + ((gx + 0.5) / GRID) * (lonMax - lonMin);
            let wSum = 0, scoreSum = 0;
            for (const p of withCoords) {
              const dxKm = (lon - p.lon) * kmPerDegLon;
              const dyKm = (lat - p.lat) * kmPerDegLat;
              const distKm = Math.sqrt(dxKm * dxKm + dyKm * dyKm);
              if (distKm > CUTOFF_KM) continue;
              const w = Math.exp(-(distKm * distKm) / (2 * SIGMA_KM * SIGMA_KM));
              wSum += w;
              scoreSum += w * RAIN_SCORE[p.rain];
            }
            const idx = (gy * GRID + gx) * 4;
            const score = wSum > 0 ? scoreSum / wSum : 0;
            // Opacity carries rain intensity, not just camera proximity: dry areas vanish
            // entirely (like real radar showing no echo) instead of washing the map in colour.
            const intensity = Math.min(1, score / RAIN_SCORE.Light);
            if (wSum < 0.05 || intensity <= 0) {
              img.data[idx + 3] = 0;
            } else {
              const [r, g, b] = scoreToRGB(score);
              img.data[idx] = r;
              img.data[idx + 1] = g;
              img.data[idx + 2] = b;
              img.data[idx + 3] = Math.round(Math.min(wSum, 1) * intensity * 215);
            }
          }
        }
        octx.putImageData(img, 0, 0);

        // upscale with smoothing for a soft, blended radar look
        const big = document.createElement("canvas");
        big.width = GRID * 3;
        big.height = GRID * 3;
        const bctx = big.getContext("2d");
        bctx.imageSmoothingEnabled = true;
        bctx.imageSmoothingQuality = "high";
        bctx.drawImage(off, 0, 0, big.width, big.height);

        const bounds = [[latMin, lonMin], [latMax, lonMax]];
        const url = big.toDataURL();
        if (radarOverlay) {
          radarOverlay.setUrl(url);
          radarOverlay.setBounds(bounds);
        } else {
          radarOverlay = L.imageOverlay(url, bounds, { opacity: 1, interactive: false }).addTo(map);
        }
      }

      function render(allPoints) {
        // Drop rows without coordinates up front. L.circleMarker([null,null]) throws,
        // and poll() swallows that into console.error -- so a single malformed record
        // used to abort the whole render: markers frozen, clock stuck, silently.
        const points = allPoints.filter((p) => p.lat != null && p.lon != null);
        const openId = openPopupCamId();
        // Carry the fetched history and slide position across poll-driven re-renders
        // (the marker itself gets rebuilt every poll, so this can't live on the marker).
        const prevState = {};
        for (const key in markerIndex) {
          const s = markerIndex[key];
          if (s.history) prevState[key] = { history: s.history, idx: s.idx };
        }
        liveLayer.clearLayers();
        for (const key in markerIndex) delete markerIndex[key];

        renderRadar(points);

        points.forEach((p) => {
          const color = RAIN_COLORS[p.rain] || "#888";

          const marker = L.circleMarker([p.lat, p.lon], {
            pane: "pinsPane",
            radius: 10,
            color: "#fff",
            weight: 2,
            fillColor: color,
            fillOpacity: 1,
          });

          const imgHtml = p.image_url
            ? `<div class="frame-slider">
                 <img class="frame-img" src="${p.image_url}?t=${Date.now()}" alt="${p.location_text}" onclick="openLightboxFor('${p.camera_id}')" />
                 <div class="frame-nav">
                   <button class="frame-prev" onclick="slideFrame('${p.camera_id}', 1)" title="Older frame">&#8249;</button>
                   <span class="frame-counter"></span>
                   <button class="frame-next" onclick="slideFrame('${p.camera_id}', -1)" title="Newer frame">&#8250;</button>
                 </div>
                 <div class="frame-caption"></div>
               </div>`
            : "";

          marker.bindPopup(`
            <div class="popup-card">
              <div class="district">${p.district}</div>
              <div class="loc">${p.location_text}</div>
              <span class="badge" style="background:${color}">${p.rain} rain</span>
              <div class="just">${p.justification}</div>
              ${imgHtml}
              ${p.approx ? '<div class="approx-note">Approximate location (district centroid)</div>' : ""}
              ${capturedAt(p) ? `<div class="approx-note">Last frame captured ${new Date(capturedAt(p)).toLocaleTimeString()}</div>` : ""}
            </div>
          `);

          marker.addTo(liveLayer);
          markerIndex[p.camera_id] = { marker, point: p, ...(prevState[p.camera_id] || {}) };
          if (p.image_url) {
            marker.on("popupopen", () => loadCameraHistory(p.camera_id));
          }
          if (p.camera_id === openId) marker.openPopup();
        });

        // An all-dry city renders an empty field by design, so say so explicitly --
        // otherwise a blank map is indistinguishable from a failed load.
        const counts = points.reduce((acc, p) => ((acc[p.rain] = (acc[p.rain] || 0) + 1), acc), {});
        const wet = ["Light", "Medium", "Heavy"].filter((k) => counts[k]);
        document.getElementById("rainSummary").textContent = wet.length
          ? "· " + wet.map((k) => `${counts[k]} ${k.toLowerCase()}`).join(", ") + ` of ${points.length} cameras`
          : `· no rain at any of ${points.length} cameras`;

        document.getElementById("lastUpdated").textContent =
          "· refreshed " + new Date().toLocaleTimeString();
      }

      function poll() {
        fetch("/api/rain-map")
          .then((r) => r.json())
          .then(render)
          .catch((e) => console.error("rain-map poll failed", e));
      }

      poll();
      setInterval(poll, 45000);
    </script>
  </body>
</html>
